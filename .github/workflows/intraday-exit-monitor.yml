name: Monitor active RSI exits intraday

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC.
    # Premarket target refresh: 20:15 UTC Sun-Thu = 06:15 Sydney during AEST.
    # The Python monitor safely calculates target prices outside live market hours
    # but will not record RSI exits until the ASX monitoring window is open.
    - cron: "15 20 * * 0-4"
    # Intraday 5-minute monitoring windows covering Sydney standard/daylight time.
    - cron: "*/5 23 * * 0-4"
    - cron: "*/5 0-6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: asx-rsi-intraday-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refresh active RSI targets and record live exits when market is open
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python scripts/intraday_exit_monitor.py

      - name: Commit intraday target/exit state
        run: |
          git config user.name "ASX RSI Intraday Bot"
          git config user.email "actions@github.com"
          git add data/intraday_state.json data/state.json data/scanner.json
          git diff --cached --quiet || git commit -m "Refresh intraday RSI targets and exits"
          git pull --rebase
          git push
