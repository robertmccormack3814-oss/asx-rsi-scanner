<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASX RSI Scanner</title>
<style>body{font-family:Arial;background:#f4f6f8;color:#142033;margin:0;padding:20px}.wrap{max-width:1150px;margin:auto}.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:15px;box-shadow:0 3px 14px #0001}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:#f8fafc;padding:14px;border-radius:11px}.n{font-size:24px;font-weight:700}.on{color:#087443}.off{color:#b42318}.toolbar{display:flex;gap:10px;flex-wrap:wrap}input,select{padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}#search{flex:1;min-width:250px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px 7px;border-bottom:1px solid #e6e9ee;text-align:left}.entry{color:#087443;font-weight:bold}.muted{color:#667085}</style></head>
<body><div class="wrap"><div class="card"><h1>ASX RSI(10) Scanner</h1><p class="muted">Entry: ASX 200 above SMA(200) + RSI(10) &lt; 30. Exit: RSI(10) &gt; 40 or 10 trading days.</p><div class="toolbar"><input id="search" placeholder="Search ticker or company"><select id="filter"><option value="entries">Entry candidates</option><option value="active">Active signals</option><option value="all">All scanned</option></select></div></div>
<div class="card"><div class="stats"><div class="stat">Market filter<div class="n" id="regime">—</div></div><div class="stat">ASX 200<div class="n" id="marketClose">—</div></div><div class="stat">SMA 200<div class="n" id="sma">—</div></div><div class="stat">Active signals<div class="n" id="active">—</div></div><div class="stat">New entries<div class="n" id="entries">—</div></div><div class="stat">Exits<div class="n" id="exits">—</div></div><div class="stat">Last scan<div id="updated">—</div></div></div></div>
<div class="card tablewrap"><table><thead><tr><th>Ticker</th><th>Company</th><th>Price</th><th>SMA(200)</th><th>Above SMA200?</th><th>RSI(10)</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
let D={stocks:[],active_signals:[]}; const money=n=>n==null?"—":"A$"+Number(n).toFixed(3);
async function load(){let r=await fetch("data/scanner.json?t="+Date.now(),{cache:"no-store"});D=await r.json();let on=D.market.above_sma200;regime.textContent=on?"ON":"OFF";regime.className="n "+(on?"on":"off");marketClose.textContent=D.market.close?Number(D.market.close).toFixed(1):"—";sma.textContent=D.market.sma200?Number(D.market.sma200).toFixed(1):"—";active.textContent=D.stats.active||0;entries.textContent=D.stats.entries_today||0;exits.textContent=D.stats.exits_today||0;updated.textContent=D.generated_at?new Date(D.generated_at).toLocaleString():"—";render();}
function render(){let q=search.value.toLowerCase(),f=filter.value;let a=D.stocks.filter(x=>{if(q&&!((x.symbol||"").toLowerCase().includes(q)||(x.company||"").toLowerCase().includes(q)))return false;if(f==="entries"&&!(D.market.above_sma200&&x.above_sma200&&x.rsi10<30))return false;if(f==="active"&&!x.active)return false;return true;});rows.innerHTML=a.map(x=>`<tr><td><b>${x.symbol}</b></td><td>${x.company}</td><td>${money(x.price)}</td><td>${money(x.sma200)}</td><td>${x.above_sma200?"YES":"NO"}</td><td>${Number(x.rsi10).toFixed(1)}</td><td class="${x.active?"entry":""}">${x.active?"ACTIVE":(D.market.above_sma200&&x.above_sma200&&x.rsi10<30?"ENTRY":"—")}</td></tr>`).join("");}
search.oninput=render;filter.onchange=render;load();
</script></body></html>
